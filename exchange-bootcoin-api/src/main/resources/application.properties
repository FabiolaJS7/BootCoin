spring.application.name=exchange-bootcoin-api
server.port=8809

# Profile active
spring.profiles.active=dev


management.endpoints.web.exposure.include=health,info

eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.config.import=optional:configserver:http://config-server-bc:8888
spring.cloud.config.discovery.service-id=config-server-bc
spring.cloud.config.enabled=false

