services:
  discovery-service:
    build:
      context: ../Bank/discovery-service # Ruta donde está el Dockerfile del config-server
      dockerfile: Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761" # Mapea el puerto 8761 del contenedor al puerto 8761 de tu máquina local
    networks:
      - app-network
    environment:
      SPRING_PROFILES_ACTIVE: local # Perfil activo en application.properties
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false

  config-server-bc:
    build:
      context: ../Bank/config-server-bc # Ruta donde está el Dockerfile del config-server
      dockerfile: Dockerfile
    container_name: config-server-bc
    ports:
      - "8888:8888" # Mapea el puerto 8888 del contenedor al puerto 8888 de tu máquina local
    networks:
      - app-network
    depends_on:
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: local # Perfil activo en application.properties
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/ # Apunta al discovery-service

  zookeeper:
    image: wurstmeister/zookeeper:latest
    networks:
      - app-network
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    networks:
      - app-network
    ports:
      - "9092:9092"  # Puerto para comunicación interna
      - "29092:29092"  # Puerto para comunicación externa
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - app-network
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: "host.docker.internal:29092"  # Cambiado para comunicación externa
    depends_on:
      - kafka


networks:
  app-network:
    driver: bridge

volumes:
  cache:
    driver: local